# Runs the test suite on Linux and on a real Windows machine (GitHub-hosted runners).
# Push to any branch to run it. The plugin self-updates ONLY from master, so testing on a
# branch never reaches friends' Steam.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libluajit-5.1-2
      - run: tests/run.sh -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: unit + end-to-end tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_plugin.mjs
      - name: daemon self-test (real gdigrab capture + encode on Windows)
        shell: pwsh
        run: |
          $out = python rp-webrtc.py --selftest | Out-String
          Write-Host $out
          if ($out -notmatch 'capture\+encode: PASS') { throw "Windows capture+encode failed" }

  windows-installer:
    # The real setup EXE (what friends download), end to end, against a fake Steam +
    # Millennium layout: Python detection, pyaudiowpatch, host-binary fetch, plugin copy,
    # config.json enable, logon task, and the daemon actually answering afterwards.
    # Run twice: the second run is an UPDATE and must replace the running daemon.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: fake Steam + Millennium
        shell: pwsh
        run: |
          $steam = "C:\fakesteam"
          New-Item -ItemType Directory -Force "$steam\millennium\config" | Out-Null
          '{"plugins":{"enabledPlugins":[]}}' | Set-Content "$steam\millennium\config\config.json"
          New-Item -Force 'HKCU:\Software\Valve\Steam' | Out-Null
          Set-ItemProperty 'HKCU:\Software\Valve\Steam' SteamPath 'c:/fakesteam'
      - name: build setup EXE
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V2 '-DVERSION=0.0.0' bin\installer.nsi
          if (-not (Test-Path dist\discord-ish-steam-setup.exe)) { throw "EXE not built" }
      - name: run setup EXE (silent, bundled install.ps1)
        shell: pwsh
        env:
          DS_REPO_REF: ${{ github.sha }}
        run: |
          $p = Start-Process dist\discord-ish-steam-setup.exe -ArgumentList '/S','/offline' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup EXE exited $($p.ExitCode)" }
      - name: verify install
        shell: pwsh
        run: |
          Get-Content "$env:TEMP\discord-ish-steam-install.log" -ErrorAction SilentlyContinue
          $cfg = Get-Content C:\fakesteam\millennium\config\config.json -Raw | ConvertFrom-Json
          if ($cfg.plugins.enabledPlugins -notcontains 'discordish-chat') { throw "plugin not enabled" }
          if (-not (Test-Path C:\fakesteam\millennium\plugins\discordish-chat\backend\main.lua)) { throw "plugin not copied" }
          if (-not (Test-Path "$env:USERPROFILE\discord-ish-steam\bin\mediamtx.exe")) { throw "mediamtx.exe missing" }
          $task = Get-ScheduledTask -TaskName discordish-rp-webrtc -ErrorAction SilentlyContinue
          if (-not $task) { throw "logon task missing" }
          # The helper must run on the private runtime, not a system Python (none is needed).
          $exe = "$env:LOCALAPPDATA\discord-ish-steam\runtime\discordish-share.exe"
          if ($task.Actions[0].Execute -ne $exe) { throw "task runs $($task.Actions[0].Execute), not $exe" }
          $ok = $false
          foreach ($i in 1..30) {
            try { $j = Invoke-RestMethod http://127.0.0.1:48592/ping; if ($j.ok) { $ok = $true; break } } catch {}
            Start-Sleep 1
          }
          if (-not $ok) { throw "daemon never answered /ping" }
          Write-Host "daemon up:" ($j | ConvertTo-Json -Compress)
          $names = (Get-CimInstance Win32_Process | ? { $_.CommandLine -like '*rp-webrtc.py*' }).Name
          if ($names -notcontains 'discordish-share.exe') { throw "helper not running as discordish-share.exe: $names" }
          & "$env:LOCALAPPDATA\discord-ish-steam\runtime\python.exe" "$env:USERPROFILE\discord-ish-steam\rp-webrtc.py" --selftest

      - name: re-run setup EXE (update) replaces the running daemon
        shell: pwsh
        env:
          DS_REPO_REF: ${{ github.sha }}
        run: |
          $before = (Get-CimInstance Win32_Process | ? { $_.CommandLine -like '*rp-webrtc.py*' -and $_.Name -notmatch '^(powershell|pwsh|cmd)' }).ProcessId
          $p = Start-Process dist\discord-ish-steam-setup.exe -ArgumentList '/S','/offline' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup EXE exited $($p.ExitCode)" }
          $ok = $false
          foreach ($i in 1..30) {
            $after = (Get-CimInstance Win32_Process | ? { $_.CommandLine -like '*rp-webrtc.py*' -and $_.Name -notmatch '^(powershell|pwsh|cmd)' }).ProcessId
            try { $j = Invoke-RestMethod http://127.0.0.1:48592/ping; if ($j.ok -and $after -and -not ($after | ? { $before -contains $_ })) { $ok = $true; break } } catch {}
            Start-Sleep 1
          }
          if (-not $ok) { throw "daemon was not replaced (before: $before, after: $after)" }
          Write-Host "daemon replaced: $before -> $after"
      - uses: actions/upload-artifact@v4
        with:
          name: discord-ish-steam-setup
          path: dist/discord-ish-steam-setup.exe
